name: Knight Capital Advanced Guard

on: [push, pull_request]

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Scan code
        run: |
          echo "Scanning..."
          if grep -r "activatePowerPegMode" .; then
            echo "ERROR detected!"
            exit 1
          fi